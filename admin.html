<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Input Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

  <header class="bg-gray-900 text-white py-4 px-6 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold">Admin Dashboard - Toko Baju</h1>
    <a href="index.html" class="text-sm text-gray-300 hover:text-white border border-gray-700 px-3 py-1.5 rounded-lg">
      &larr; Lihat Website Katalog
    </a>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Form Input Produk -->
    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
      <h2 class="text-lg font-bold mb-4 text-gray-800">Tambah Produk Baru</h2>
      <form id="productForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Baju</label>
          <input type="text" id="name" required placeholder="Contoh: Kemeja Oversize Linen" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
          <select id="category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            <option value="Atasan">Atasan / Kaos / Kemeja</option>
            <option value="Bawahan">Celana / Rok</option>
            <option value="Dress">Dress / Gamis</option>
            <option value="Jaket">Jaket / Outer</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Harga Normal (Rp)</label>
            <input type="number" id="price" required placeholder="150000" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Harga Diskon (Rp)</label>
            <input type="number" id="discountPrice" placeholder="Kosongkan jika tidak diskon" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Varian (Pisahkan dengan koma)</label>
          <input type="text" id="variants" placeholder="Contoh: Hitam M, Hitam L, Putih M" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">URL Gambar Utama</label>
          <input type="url" id="image" required placeholder="https://..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">URL Gambar Tambahan (Koma)</label>
          <input type="text" id="moreImages" placeholder="https://img1.jpg, https://img2.jpg" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Singkat</label>
          <textarea id="description" rows="3" required placeholder="Bahan katun adem, ukuran All Size..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-gray-900 text-white py-2.5 px-4 rounded-lg text-sm font-semibold hover:bg-rose-600 transition">
          Simpan Produk
        </button>
      </form>
    </div>

    <!-- Tabel Daftar Produk -->
    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold mb-4 text-gray-800">Daftar Produk Aktif</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b bg-gray-50 text-gray-600">
              <th class="p-3">Info</th>
              <th class="p-3">Harga & Diskon</th>
              <th class="p-3">Varian Tersedia</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="adminProductTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("productForm");
    const tableBody = document.getElementById("adminProductTable");

    function getProducts() {
      return JSON.parse(localStorage.getItem("store_products")) || [];
    }

    function renderAdminTable() {
      const products = getProducts();
      tableBody.innerHTML = "";

      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-400">Belum ada data produk.</td></tr>`;
        return;
      }

      products.forEach((p, index) => {
        const discountText = p.discountPrice ? `<br><span class="text-rose-600 font-bold">Diskon: Rp ${p.discountPrice.toLocaleString('id-ID')}</span>` : '';
        const variantText = p.variants && p.variants.length > 0 ? p.variants.join(', ') : '-';

        const row = document.createElement("tr");
        row.className = "border-b hover:bg-gray-50";
        row.innerHTML = `
          <td class="p-3 flex items-center gap-3">
            <img src="${p.image}" class="w-12 h-12 object-cover rounded-md border border-gray-200">
            <div>
              <p class="font-semibold text-gray-800">${p.name}</p>
              <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-[10px] uppercase">${p.category}</span>
            </div>
          </td>
          <td class="p-3">Normal: Rp ${Number(p.price).toLocaleString('id-ID')} ${discountText}</td>
          <td class="p-3 text-gray-600 text-xs">${variantText}</td>
          <td class="p-3 text-center">
            <button onclick="deleteProduct(${index})" class="text-red-600 hover:text-red-800 text-xs font-bold border border-red-200 px-2.5 py-1 rounded hover:bg-red-50">
              Hapus
            </button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      
      const variantsInput = document.getElementById("variants").value;
      const moreImagesInput = document.getElementById("moreImages").value;

      const newProduct = {
        id: Date.now(),
        name: document.getElementById("name").value,
        category: document.getElementById("category").value,
        price: parseFloat(document.getElementById("price").value),
        discountPrice: document.getElementById("discountPrice").value ? parseFloat(document.getElementById("discountPrice").value) : null,
        variants: variantsInput ? variantsInput.split(',').map(v => v.trim()).filter(v => v !== '') : [],
        image: document.getElementById("image").value,
        moreImages: moreImagesInput ? moreImagesInput.split(',').map(i => i.trim()).filter(i => i !== '') : [],
        description: document.getElementById("description").value
      };

      const products = getProducts();
      products.push(newProduct);
      localStorage.setItem("store_products", JSON.stringify(products));

      form.reset();
      renderAdminTable();
      alert("Produk berhasil ditambahkan dengan varian & diskon!");
    });

    function deleteProduct(index) {
      if (confirm("Hapus produk ini?")) {
        const products = getProducts();
        products.splice(index, 1);
        localStorage.setItem("store_products", JSON.stringify(products));
        renderAdminTable();
      }
    }

    document.addEventListener("DOMContentLoaded", renderAdminTable);
  </script>
</body>
</html>
